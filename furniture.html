<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Shot 47 XLVII | Furniture & Decor AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color-scheme: light; }
        
        /* The Native Gray Loading Bar at the top */
        #main-viewer::part(default-progress-bar) {
            background-color: #94a3b8; 
            height: 4px;
        }

        #viewer-overlay { 
            display: none; 
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: white;
        }
        #viewer-overlay.active { display: flex; animation: slideUp 0.3s ease forwards; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .admin-controls { display: none; }
        body.admin-mode .admin-controls { display: inline-flex; }
        
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #0284c7; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        body.modal-open { overflow: hidden; position: fixed; width: 100%; }
        #main-viewer { touch-action: none; }

        .close-viewer-btn, .nav-btn {
            z-index: 100;
            cursor: pointer !important;
            pointer-events: auto;
        }

        .close-viewer-btn {
            position: absolute;
            top: 55px; 
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="antialiased pb-20">

    <nav class="fixed w-full z-40 top-0 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="font-bold tracking-tight text-xl text-slate-900">← SHOT 47 XLVII</a>
            <span class="text-sm font-semibold text-slate-500 cursor-pointer" ondblclick="toggleAdmin()">Furniture & Decor Portfolio</span>
        </div>
    </nav>

    <section class="pt-32 pb-10 px-6 max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-slate-900 mb-2">Furniture & Decor</h1>
        <p class="text-slate-600 mb-8">Select an item to view in high-fidelity 3D and place it in your space.</p>
        
        <button onclick="addNewCard()" class="admin-controls mb-6 bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-bold">
            + Add New Furniture Scan
        </button>
        <div id="model-grid" class="flex flex-col gap-4"></div>
    </section>

    <div id="viewer-overlay" class="flex-col md:flex-row">
        <button onclick="closeViewer()" class="close-viewer-btn text-slate-900">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <div id="viewer-frame" class="w-full md:w-2/3 h-[55vh] md:h-full bg-slate-50 relative flex items-center justify-center order-1">
            <div class="absolute inset-0 flex items-center justify-between px-4 z-50 pointer-events-none">
                <button onclick="changeModel(-1)" class="nav-btn pointer-events-auto bg-white/90 p-3 rounded-full shadow-lg border border-slate-200">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
                </button>
                <button onclick="changeModel(1)" class="nav-btn pointer-events-auto bg-white/90 p-3 rounded-full shadow-lg border border-slate-200">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M9 5l6 6-6 6"></path></svg>
                </button>
            </div>

            <div id="loading-ui" class="absolute inset-0 flex flex-col items-center justify-center z-40 bg-slate-50">
                <div class="loader mb-4"></div>
                <p class="text-slate-500 font-medium">Loading 3D Twin...</p>
            </div>
        </div>

        <div id="sidebar-info" class="w-full md:w-1/3 p-8 flex flex-col justify-center bg-white order-2">
            <h2 id="sidebar-title" class="text-3xl font-bold text-slate-900 mb-4">Title</h2>
            <p id="sidebar-desc" class="text-slate-600 leading-relaxed">Description</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_3E_BmitmKo9QSKShPMjQePGrz9LmrWY",
            authDomain: "shot47-database.firebaseapp.com",
            projectId: "shot47-database",
            storageBucket: "shot47-database.firebasestorage.app",
            messagingSenderId: "77237094269",
            appId: "1:77237094269:web:a90a6c6239cb66e3102e14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Switched category namespace to keep furniture separate from hospitality entries
        const categoryName = "furniture_models"; 
        let modelsData = [];
        let currentModelIndex = 0;

        window.openViewer = function(index) {
            currentModelIndex = index;
            const model = modelsData[index];
            const viewerContainer = document.getElementById('viewer-frame');
            const overlay = document.getElementById('viewer-overlay');
            const loader = document.getElementById('loading-ui');
            
            document.getElementById('sidebar-title').innerText = model.title;
            document.getElementById('sidebar-desc').innerText = model.desc;

            overlay.classList.add('active');
            document.body.classList.add('modal-open');
            loader.style.display = 'flex';

            const oldViewer = document.getElementById('main-viewer');
            if(oldViewer) {
                if (typeof oldViewer.dispose === 'function') oldViewer.dispose();
                oldViewer.remove();
            }

            const newViewer = document.createElement('model-viewer');
            newViewer.id = 'main-viewer';
            newViewer.className = 'w-full h-full';
            newViewer.setAttribute('loading', 'eager');
            newViewer.setAttribute('ar', '');
            newViewer.setAttribute('ar-modes', 'webxr scene-viewer quick-look');
            newViewer.setAttribute('camera-controls', '');
            newViewer.setAttribute('shadow-intensity', '0.6');
            newViewer.setAttribute('environment-image', 'neutral');

            newViewer.src = model.glb;
            newViewer.iosSrc = model.usdz;

            const arButton = document.createElement('button');
            arButton.slot = 'ar-button';
            arButton.className = 'absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-8 py-3 rounded-full font-bold shadow-xl z-50';
            arButton.innerText = 'View in AR Space';
            newViewer.appendChild(arButton);

            viewerContainer.appendChild(newViewer);
            newViewer.addEventListener('load', () => { loader.style.display = 'none'; }, { once: true });
        };

        window.changeModel = function(direction) {
            let newIndex = currentModelIndex + direction;
            if (newIndex >= modelsData.length) newIndex = 0;
            if (newIndex < 0) newIndex = modelsData.length - 1;
            window.openViewer(newIndex);
        };

        window.closeViewer = function() {
            document.getElementById('viewer-overlay').classList.remove('active');
            const viewer = document.getElementById('main-viewer');
            if(viewer) {
                if (typeof viewer.dispose === 'function') viewer.dispose();
                viewer.remove();
            }
            document.body.classList.remove('modal-open');
        };

        window.addNewCard = async function() {
            const title = prompt("Scan Title:");
            const desc = prompt("Description:");
            const glb = prompt("Paste Firebase GLB URL:");
            const usdz = prompt("Paste Firebase USDZ URL:");
            const img = prompt("Thumbnail Image URL:");
            if(!title || !glb) return;
            try {
                await addDoc(collection(db, categoryName), {
                    title, desc, glb, usdz, img, createdAt: new Date()
                });
                loadFromDatabase();
            } catch (e) { alert("Error saving."); }
        };

        window.toggleAdmin = async function() {
            if(document.body.classList.contains('admin-mode')) { await signOut(auth); return; }
            const email = prompt("Admin Email:");
            const pass = prompt("Admin Password:");
            if(email && pass) {
                try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert("Login Failed"); }
            }
        };

        async function loadFromDatabase() {
            const querySnapshot = await getDocs(collection(db, categoryName));
            modelsData = [];
            querySnapshot.forEach((doc) => { modelsData.push({ db_id: doc.id, ...doc.data() }); });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('model-grid');
            grid.innerHTML = '';
            modelsData.forEach((model, index) => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm">
                        <div class="cursor-pointer flex-1" onclick="openViewer(${index})">
                            <h3 class="font-bold text-slate-900">${model.title}</h3>
                            <p class="text-xs text-slate-500">${model.desc}</p>
                        </div>
                        <img src="${model.img}" class="w-16 h-16 rounded-lg object-cover ml-4 cursor-pointer" onclick="openViewer(${index})">
                    </div>
                `);
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) document.body.classList.add('admin-mode');
            else document.body.classList.remove('admin-mode');
        });

        loadFromDatabase();
    </script>
</body>
</html>
