<script type="module">
    // 1. Import EVERYTHING needed from the Firebase CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        getDocs, 
        addDoc, 
        deleteDoc, 
        doc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 2. Your Firebase Configuration (Ensure these are your actual keys)
    const firebaseConfig = {
        apiKey: "AIzaSyC_3E_BmitmKo9QSKShPMjQePGrz9LmrWY",
        authDomain: "shot47-database.firebaseapp.com",
        projectId: "shot47-database",
        storageBucket: "shot47-database.firebasestorage.app",
        messagingSenderId: "77237094269",
        appId: "1:77237094269:web:a90a6c6239cb66e3102e14"
    };

    // 3. Initialize Services
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    const categoryName = "hospitality_models"; 
    let modelsData = [];

    // --- GLOBAL FUNCTIONS (Attached to 'window' so HTML can call them) ---

    window.toggleAdmin = async function() {
        if(document.body.classList.contains('admin-mode')) {
            await signOut(auth);
            alert("Logged out.");
            return;
        }
        const email = prompt("Admin Email:");
        const pass = prompt("Admin Password:");
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (error) {
            alert("Login Failed: " + error.message);
        }
    };

    window.addNewCard = async function() {
        const title = prompt("Enter Scan Title:");
        if(!title) return;
        const desc = prompt("Description:");
        const glb = prompt("GLB ID:");
        const usdz = prompt("USDZ ID:");
        
        try {
            await addDoc(collection(db, categoryName), {
                title, desc, glb, usdz,
                img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80",
                createdAt: new Date()
            });
            loadFromDatabase();
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    window.deleteCard = async function(db_id) {
        if(confirm("Delete this scan?")) {
            try {
                await deleteDoc(doc(db, categoryName, db_id));
                loadFromDatabase();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }
    };

    window.openViewer = function(index) {
        const model = modelsData[index];
        document.getElementById('sidebar-title').innerText = model.title;
        document.getElementById('sidebar-desc').innerText = model.desc;

        const viewer = document.getElementById('main-viewer');
        const overlay = document.getElementById('viewer-overlay');
        const loader = document.getElementById('loading-ui');
        
        overlay.classList.add('active');
        loader.style.display = 'flex';
        
        // Ensure you replace this with your actual Cloudflare Worker URL
        const proxyBase = "https://drive-proxy.yourname.workers.dev/?id=";
        viewer.setAttribute('src', proxyBase + model.glb);
        viewer.setAttribute('ios-src', proxyBase + model.usdz);
        viewer.addEventListener('load', () => { loader.style.display = 'none'; }, { once: true });
    };

    window.closeViewer = function() {
        document.getElementById('viewer-overlay').classList.remove('active');
        const viewer = document.getElementById('main-viewer');
        viewer.setAttribute('src', '');
        viewer.setAttribute('ios-src', '');
    };

    // --- INTERNAL LOGIC ---

    async function loadFromDatabase() {
        const grid = document.getElementById('model-grid');
        grid.innerHTML = '<p class="text-center py-10 text-slate-400">Loading catalog...</p>';
        
        try {
            const querySnapshot = await getDocs(collection(db, categoryName));
            modelsData = [];
            querySnapshot.forEach((doc) => {
                modelsData.push({ db_id: doc.id, ...doc.data() });
            });
            renderGrid();
        } catch (e) {
            grid.innerHTML = '<p class="text-red-500">Error loading database. Check console.</p>';
            console.error(e);
        }
    }

    function renderGrid() {
        const grid = document.getElementById('model-grid');
        grid.innerHTML = '';
        if (modelsData.length === 0) {
            grid.innerHTML = '<p class="text-center py-10 text-slate-400">No scans found. Log in to add one.</p>';
            return;
        }
        modelsData.forEach((model, index) => {
            const cardHTML = `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between hover:shadow-md transition">
                <div class="flex items-center gap-4 cursor-pointer flex-1" onclick="openViewer(${index})">
                    <img src="${model.img}" class="w-16 h-16 rounded-lg object-cover bg-slate-100">
                    <div>
                        <h3 class="font-bold text-slate-900">${model.title}</h3>
                        <p class="text-xs text-slate-500">${model.desc}</p>
                    </div>
                </div>
                <button onclick="deleteCard('${model.db_id}')" class="admin-controls ml-4 text-red-500 hover:text-red-700 p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>`;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });
    }

    onAuthStateChanged(auth, (user) => {
        if (user) document.body.classList.add('admin-mode');
        else document.body.classList.remove('admin-mode');
    });

    // Start
    loadFromDatabase();
</script>
