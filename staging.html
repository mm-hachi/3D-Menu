<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light only">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Shot 47 XLVII | Staging Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="staging.css">
</head>
<body>

    <div id="sidebar">
        <a href="furniture.html" class="back-link">
            ← Back to Departments Hub
        </a>

        <button id="freeze-btn" class="btn-danger">🛑 FREEZE ENGINE</button>
        
        <hr class="divider" />

        <h2>Staging Catalog</h2>
        <p class="subtitle">Select a department to browse available spatial assets.</p>

        <div id="category-tabs">
            <button class="tab-btn active" data-category="furniture">Furniture</button>
            <button class="tab-btn" data-category="carpet">Carpets</button>
            <button class="tab-btn" data-category="decor">Decor</button>
        </div>

        <div id="catalog-list"></div>

        <div id="controls-hint">
            <p><strong>Transform Hotkeys:</strong></p>
            <ul>
                <li><kbd>Left-Click</kbd> Model: Select / Focus</li>
                <li><kbd>T</kbd> Key: Move Mode (Translate)</li>
                <li><kbd>R</kbd> Key: Rotate Mode</li>
                <li><kbd>Delete</kbd> / <kbd>Backspace</kbd>: Delete Model</li>
            </ul>
        </div>
    </div>

    <div id="canvas-container">
        
        <div id="mobile-transform-toolbar">
            <button id="tool-translate" class="tool-btn active-tool" title="Move Mode">✛ Move</button>
            <button id="tool-rotate" class="tool-btn" title="Rotate Mode">⟳ Rotate</button>
            <button id="tool-delete" class="tool-btn delete-tool-mode" title="Toggle Delete Mode">🗑 Delete Mode</button>
            <button id="view-ar-btn" class="btn-ar">View in Room</button>
        </div>

    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module" src="staging.js"></script>
</body>
</html>
