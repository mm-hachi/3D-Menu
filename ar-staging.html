<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shot 47 | Direct AR Staging</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        
        /* Hides model-viewer's default canvas AR button */
        model-viewer::part(default-ar-button) {
            display: none !important;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden relative">

    <!-- Loading & Action Overlay Gate -->
    <div id="loader-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 text-center text-white bg-slate-950 transition-opacity duration-300">
        <!-- Spinner (Hidden when model is ready or has error) -->
        <div id="loader-spinner" class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-emerald-500 mb-6"></div>
        
        <!-- Status Messages -->
        <h2 id="loader-title" class="text-xl font-bold tracking-tight">Preparing AR Space</h2>
        <p id="loader-subtitle" class="text-sm text-slate-400 mt-2 max-w-xs">Downloading 3D asset files...</p>
        
        <!-- Dynamic Tap-to-Enter Action Button (Shown only when ready) -->
        <button id="enter-ar-btn" class="hidden mt-8 px-8 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center gap-2">
            <span>📱 Drop Model in AR Space</span>
        </button>
        
        <!-- Error Fallback Action Button (Shown only on failure) -->
        <button id="error-btn" onclick="window.history.back()" class="hidden mt-8 px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition">
            ← Go Back to Showroom
        </button>
    </div>

    <!-- Active 3D/AR Frame -->
    <model-viewer 
        id="ar-viewer"
        class="w-full h-full"
        src="" 
        ios-src=""
        alt="High fidelity staging mesh" 
        ar 
        ar-modes="webxr quick-look" 
        camera-controls 
        interaction-prompt="none"
        shadow-intensity="1">
        
        <!-- Native Hidden Trigger Hook -->
        <button slot="ar-button" id="native-ar-trigger" class="hidden"></button>

        <!-- WebXR DOM Overlay UI Layer (Visible while inside the camera space) -->
        <div id="ar-dom-overlay" slot="xr-overlay" class="absolute inset-x-0 bottom-0 p-6 bg-gradient-to-t from-slate-950/90 to-transparent text-white flex flex-col gap-4 pointer-events-none">
            <div class="pointer-events-auto">
                <span class="px-2.5 py-1 text-[10px] font-bold tracking-wider uppercase bg-emerald-600 rounded-full">WebXR Engine</span>
                <h2 id="model-display-name" class="text-xl font-bold mt-2">Staging Asset</h2>
                <p class="text-xs text-slate-300">Pinch to scale, drag to position</p>
            </div>
            
            <div class="flex gap-3 pointer-events-auto">
                <button onclick="rotateModel()" class="flex-1 py-3 bg-white/10 hover:bg-white/20 border border-white/25 text-white text-xs font-semibold rounded-xl backdrop-blur-md transition">
                    🔄 Rotate 90°
                </button>
                <button onclick="exitSandbox()" class="flex-1 py-3 bg-red-600/90 hover:bg-red-700 text-white text-xs font-semibold rounded-xl transition">
                    ❌ Close Space
                </button>
            </div>
        </div>
        
    </model-viewer>

    <script>
        const viewer = document.getElementById('ar-viewer');
        const loaderOverlay = document.getElementById('loader-overlay');
        const loaderSpinner = document.getElementById('loader-spinner');
        const loaderTitle = document.getElementById('loader-title');
        const loaderSubtitle = document.getElementById('loader-subtitle');
        const enterArBtn = document.getElementById('enter-ar-btn');
        const errorBtn = document.getElementById('error-btn');
        const trigger = document.getElementById('native-ar-trigger');
        const modelNameDisplay = document.getElementById('model-display-name');

        // Parameter intake
        const params = new URLSearchParams(window.location.search);
        const glb = params.get('glb') || 'https://modelviewer.dev/shared-assets/models/Chair.glb'; // Demo Fallback
        const usdz = params.get('usdz') || 'https://modelviewer.dev/shared-assets/models/Chair.usdz'; // Demo Fallback
        const name = params.get('name') || "Staging Model";

        // Assign model URLs to the engine
        viewer.src = glb;
        viewer.iosSrc = usdz;
        modelNameDisplay.textContent = name;

        // 1. Show download progress
        viewer.addEventListener('progress', (event) => {
            const percent = Math.round(event.detail.totalProgress * 100);
            loaderSubtitle.textContent = `Downloading assets: ${percent}%`;
        });

        // 2. Trigger ready state on completion
        viewer.addEventListener('load', () => {
            loaderSpinner.classList.add('hidden');
            loaderTitle.textContent = "Asset Staged Successfully!";
            loaderSubtitle.textContent = `"${name}" is cached and ready for physical placement.`;
            enterArBtn.classList.remove('hidden');
        });

        // 3. Handle broken links or server CORS blocks gracefully
        viewer.addEventListener('error', (err) => {
            console.error("Asset Load Failure:", err);
            loaderSpinner.classList.add('hidden');
            loaderTitle.textContent = "Staging Failed";
            loaderSubtitle.textContent = "The 3D model could not be downloaded. Verify the file URL and confirm CORS is allowed on your hosting platform.";
            errorBtn.classList.remove('hidden');
        });

        // 4. Secure User Gesture Trigger for Camera AR
        enterArBtn.addEventListener('click', () => {
            // Trigger native AR mechanism safely
            if (viewer.canActivateAR) {
                trigger.click();
            } else {
                viewer.activateAR();
            }

            // Hide the gateway overlay shortly after they transition into AR
            setTimeout(() => {
                loaderOverlay.style.opacity = '0';
                setTimeout(() => loaderOverlay.classList.add('hidden'), 300);
            }, 1500);
        });

        // AR Space HUD Functions
        function rotateModel() {
            const orbit = viewer.getCameraOrbit();
            const newTheta = orbit.theta + (Math.PI / 2);
            viewer.cameraOrbit = `${newTheta}rad ${orbit.phi}rad ${orbit.radius}m`;
        }

        function exitSandbox() {
            // Purge WebGL context cache for Safari safety
            const gl = viewer.canvas?.getContext('webgl') || viewer.canvas?.getContext('webgl2');
            if (gl) {
                const ext = gl.getExtension('WEBGL_lose_context');
                if (ext) ext.loseContext();
            }
            viewer.src = '';
            viewer.iosSrc = '';
            window.location.href = 'furniture.html';
        }
    </script>
</body>
</html>
