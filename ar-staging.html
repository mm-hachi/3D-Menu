<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shot 47 XLVII | 8th Wall AR Sandbox</title>

    <!-- 8th Wall SLAM Engine & Extras (open source engine binary, no app key required) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
        data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ar_staging.css">
</head>

<body>
    <!-- 8th Wall renders the camera feed and 3D scene directly to this canvas -->
    <canvas id="camera-canvas"></canvas>

    <!-- CSS Reticle — always pixel-perfect at viewport center. Gray while
         scanning, turns green (.locked) once a real surface is found. -->
    <div id="reticle">
        <div class="reticle-paren reticle-left"></div>
        <div class="reticle-paren reticle-right"></div>
    </div>

    <!-- Custom AR Overlay -->
    <div id="ar-overlay">
        <!-- Top HUD Bar -->
        <div id="hud-top">
            <div class="hud-group left-group">
                <a href="furniture.html" id="exit-ar-btn" class="glass-btn icon-text-btn" title="Exit AR App">
                    <span class="btn-icon">←</span> Exit
                </a>
                <button id="hamburger-btn" class="glass-btn icon-text-btn" title="Toggle Spatial Catalog">
                    <span class="btn-icon">☰</span> Catalog
                </button>
            </div>

            <div id="budget-badge">
                <span class="budget-label">Total Tally</span>
                <span id="budget-value">$0.00</span>
            </div>

            <div class="hud-group right-group">
                <button id="clear-btn" class="glass-icon-btn" title="Clear All Models">🗑️</button>
            </div>
        </div>

        <!-- Placement Guidance Readout -->
        <div id="placement-hint">Aim at a surface and tap 'Place Model'</div>

        <!-- Dynamic Action Toolbar (Floating Center/Bottom) -->
        <div id="action-bar">
            <!-- Dynamic Place Button: Appears when catalog model selected -->
            <button id="place-btn" class="btn-action btn-place" style="display: none;">
                ➕ Place Model
            </button>

            <!-- Dynamic Delete Button: Appears when placed 3D model selected -->
            <button id="delete-selected-btn" class="btn-action btn-delete" style="display: none;">
                🗑️ Delete Selected
            </button>
        </div>

        <!-- Toggleable Catalog Drawer (Hamburger Menu) -->
        <div id="catalog-drawer" class="collapsed">
            <div class="drawer-header">
                <div class="drawer-title-group">
                    <span class="drawer-title">Spatial Catalog</span>
                    <span class="drawer-subtitle">Select an asset to stage</span>
                </div>
                <button id="close-drawer-btn" class="icon-close-btn" title="Place">Place</button>
            </div>
            <div id="category-tabs">
                <button class="tab-btn active" data-category="furniture">Furniture</button>
                <button class="tab-btn" data-category="carpets">Carpets</button>
                <button class="tab-btn" data-category="decor">Decor</button>
            </div>
            <div id="catalog-list" class="horizontal-scroll">
                <!-- JS will populate -->
            </div>
        </div>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="ar_staging.js"></script>
</body>

</html>
