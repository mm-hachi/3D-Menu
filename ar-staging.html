<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shot 47 XLVII | 8th Wall AR Sandbox</title>

    <!-- 8th Wall SLAM Engine & Extras -->
    <script src="//cdn.8thwall.com/apps/xrweb"></script>
    <script src="//cdn.8thwall.com/apps/xrextras"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ar_staging.css">
</head>

<body>
    <!-- 8th Wall renders the camera feed and 3D scene directly to this canvas -->
    <canvas id="camera-canvas"></canvas>

    <!-- Custom AR Overlay -->
    <div id="ar-overlay">
        <div id="hud-top">
            <div id="budget-badge">
                <span class="budget-label">Total</span>
                <span id="budget-value">$0.00</span>
            </div>
            <button id="clear-btn" class="glass-icon-btn" title="Clear Scene">🗑️</button>
        </div>

        <div id="placement-hint">Tap on a surface to place model</div>

        <div id="catalog-drawer">
            <div id="category-tabs">
                <button class="tab-btn active" data-category="furniture">Furniture</button>
                <button class="tab-btn" data-category="carpets">Carpets</button>
                <button class="tab-btn" data-category="decor">Decor</button>
            </div>
            <div id="catalog-list" class="horizontal-scroll">
                <!-- JS will populate -->
            </div>
        </div>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="ar_staging.js"></script>
</body>

</html>
